name: Django CI

on:
  push:
    branches:
      - main
      - revisao-tecnica

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install django reportlab

      - run: python manage.py test