<!DOCTYPE html>
<html>
<head>
    <title>Consulta de Alunos</title>
</head>
<body>

<h1>Alunos Cadastrados</h1>

<table border="1">

<tr>
    <th>Nome</th>
    <th>Matrícula</th>
    <th>Turma</th>
</tr>

{% for aluno in alunos %}

<tr>
    <td>{{ aluno.nome }}</td>
    <td>{{ aluno.matricula }}</td>
    <td>{{ aluno.turma }}</td>
</tr>

{% endfor %}

</table>

<br>

<a href="/">Voltar</a>

</body>
</html>
