<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Relatório para Pais</title>
</head>
<body>

<h1>Relatório Pedagógico</h1>

<form method="post">

    {% csrf_token %}

    <label>Aluno</label>

    <select name="aluno">

        {% for aluno in alunos %}
        <option value="{{ aluno.id }}">
            {{ aluno.nome }}
        </option>
        {% endfor %}

    </select>

    <button type="submit">
        Gerar Relatório
    </button>

</form>

</body>
</html>
