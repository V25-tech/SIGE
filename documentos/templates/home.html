{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SIGE</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background: linear-gradient(
                180deg,
                #0d47a1,
                #1976d2
            );

            min-height:100vh;
        }

        .topo{

            text-align:center;
            padding:25px;
        }

        .topo img{

            width:220px;
        }

        .container{

            background:#f5f5f5;

            border-radius:40px 40px 0 0;

            padding:40px 25px;

            min-height:100vh;
        }

        .logo-centro{

            text-align:center;
        }

        .logo-centro img{

            width:180px;
            margin-bottom:20px;
        }

        h1{

            color:#1453b1;
            font-size:60px;
            text-align:center;
            margin-bottom:15px;
        }

        .subtitulo{

            text-align:center;
            font-size:20px;
            color:#444;
            margin-bottom:10px;
        }

        .frase{

            text-align:center;
            color:#1976d2;
            font-weight:bold;
            margin-bottom:20px;
        }

        .escola{

            text-align:center;
            color:#666;
            margin-bottom:40px;
        }

        .cards{

            display:flex;
            flex-direction:column;
            gap:20px;
        }

        .card{

            background:white;

            border-radius:20px;

            padding:25px;

            text-align:center;

            box-shadow:0 3px 15px rgba(
                0,
                0,
                0,
                0.15
            );
        }

        .card h3{

            color:#0d47a1;
            margin-bottom:10px;
        }

        .card span{

            font-size:50px;
            color:#1976d2;
            font-weight:bold;
        }

        .menu{

            margin-top:40px;

            display:flex;

            flex-direction:column;

            gap:15px;
        }

        .botao{

            background:#0d47a1;

            color:white;

            text-decoration:none;

            padding:18px;

            border-radius:12px;

            text-align:center;

            font-weight:bold;

            font-size:20px;
        }

        .botao:hover{

            background:#08357c;
        }

    </style>

</head>

<body>

    <div class="topo">

        <img
            src="{% static 'img/logo_sige.png' %}"
            alt="SIGE"
        >

    </div>

    <div class="container">

        <div class="logo-centro">

            <img
                src="{% static 'img/logo_sige.png' %}"
                alt="SIGE"
            >

        </div>

        <h1>SIGE</h1>

        <p class="subtitulo">

            Sistema Integrado de Gestão Escolar

        </p>

        <p class="frase">

            Conectando Educação, Gestão e Tecnologia

        </p>

        <p class="escola">

            EMEB Dionysio Bovo

        </p>

        <div class="cards">

            <div class="card">

                <h3>👨‍🎓 Alunos</h3>

                <span>6</span>

            </div>

            <div class="card">

                <h3>👨‍👩‍👧 Responsáveis</h3>

                <span>5</span>

            </div>

            <div class="card">

                <h3>📄 Documentos</h3>

                <span>4</span>

            </div>

        </div>

        <div class="menu">

            <a
                href="/alunos/"
                class="botao"
            >
                👨‍🎓 Consultar Alunos
            </a>

            <a
                href="/alunos/busca-ativa/"
                class="botao"
            >
                🔎 Busca Ativa
            </a>

            <a
                href="/indicadores/"
                class="botao"
            >
                📊 Dashboard da Direção
            </a>

            <a
                href="/emitir-declaracao/"
                class="botao"
            >
                📄 Emitir Declaração
            </a>

            <a
                href="/admin/"
                class="botao"
            >
                ⚙️ Administração
            </a>

        </div>

    </div>

</body>

</html>
