{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SIGE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family: Arial, sans-serif;

    background: linear-gradient(
        180deg,
        #0d47a1,
        #1976d2
    );

    min-height:100vh;
}

.topo{

    text-align:center;

    padding:20px;
}

.topo img{

    width:180px;
    max-width:90%;
}

.card-principal{

    background:#ffffff;

    border-radius:35px 35px 0 0;

    margin-top:20px;

    padding:30px 20px;

    min-height:90vh;
}

.logo-centro{

    text-align:center;

    margin-bottom:20px;
}

.logo-centro img{

    width:150px;

    max-width:80%;
}

h1{

    text-align:center;

    color:#1453b1;

    font-size:58px;

    margin-bottom:10px;
}

.subtitulo{

    text-align:center;

    font-size:20px;

    color:#444;

    margin-bottom:15px;
}

.frase{

    text-align:center;

    color:#1976d2;

    font-weight:bold;

    margin-bottom:15px;
}

.escola{

    text-align:center;

    color:#666;

    margin-bottom:30px;
}

.cards{

    max-width:500px;

    margin:auto;
}

.card{

    background:#f8f8f8;

    border-radius:20px;

    box-shadow:0 3px 12px rgba(
        0,
        0,
        0,
        .12
    );

    padding:25px;

    margin-bottom:20px;

    text-align:center;
}

.card h3{

    color:#0d47a1;

    margin-bottom:15px;
}

.numero{

    color:#1976d2;

    font-size:50px;

    font-weight:bold;
}

.menu{

    max-width:500px;

    margin:30px auto;
}

.botao{

    display:block;

    background:#0d47a1;

    color:white;

    text-decoration:none;

    text-align:center;

    padding:18px;

    margin-bottom:15px;

    border-radius:12px;

    font-size:20px;

    font-weight:bold;

    transition:.3s;
}

.botao:hover{

    background:#08357c;
}

@media (max-width:500px){

    h1{

        font-size:42px;
    }

    .subtitulo{

        font-size:18px;
    }

    .numero{

        font-size:42px;
    }

    .botao{

        font-size:18px;
        padding:16px;
    }

}

</style>

</head>

<body>

<div class="topo">

    <img
        src="{% static 'img/logo_sige.png' %}"
        alt="SIGE"
    >

</div>

<div class="card-principal">

    <div class="logo-centro">

        <img
            src="{% static 'img/logo_sige.png' %}"
            alt="SIGE"
        >

    </div>

    <h1>SIGE</h1>

    <p class="subtitulo">

        Sistema Integrado de Gestão Escolar

    </p>

    <p class="frase">

        Conectando Educação, Gestão e Tecnologia

    </p>

    <p class="escola">

        EMEB Dionysio Bovo

    </p>

    <div class="cards">

        <div class="card">

            <h3>👨‍🎓 Alunos</h3>

            <div class="numero">6</div>

        </div>

        <div class="card">

            <h3>👨‍👩‍👧 Responsáveis</h3>

            <div class="numero">5</div>

        </div>

        <div class="card">

            <h3>📄 Documentos</h3>

            <div class="numero">4</div>

        </div>

    </div>

    <div class="menu">

        <a
            href="/alunos/"
            class="botao"
        >
            👨‍🎓 Consultar Alunos
        </a>

        <a
            href="/alunos/busca-ativa/"
            class="botao"
        >
            🔎 Busca Ativa
        </a>

        <a
            href="/indicadores/"
            class="botao"
        >
            📊 Dashboard da Direção
        </a>

        <a
            href="/emitir-declaracao/"
            class="botao"
        >
            📄 Emitir Declaração
        </a>

        <a
            href="/admin/"
            class="botao"
        >
            ⚙️ Administração
        </a>

    </div>

</div>

</body>

</html>
